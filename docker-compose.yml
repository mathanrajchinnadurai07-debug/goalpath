version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goalpath-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://goalpath_user:goalpath_pass@postgres:5432/goalpath_db?schema=public
      - REDIS_URL=redis://redis:6379
      - APP_SECRET=super-secure-production-ready-goalpath-jwt-secret-key-32chars
      - NEXTAUTH_URL=http://localhost:3000
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: goalpath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: goalpath_user
      POSTGRES_PASSWORD: goalpath_pass
      POSTGRES_DB: goalpath_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goalpath_user -d goalpath_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: goalpath-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: goalpath-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI

volumes:
  postgres_data:
  redis_data:
